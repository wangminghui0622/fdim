Name: cron
Mode: dev

# Cron 配置
CronTask:
  # Cron 表达式 "0 0 2 * * *" 表示每天凌晨2点执行
  CronExecuteTime: "0 0 2 * * *"
  # 0 表示永不删除
  RetainChatRecords: 30
  # 文件过期时间 天
  FileExpireTime: 7
  # 删除对象类型
  DeleteObjectType:
    - "image"
    - "video"
    - "file"

# RPC 配置
MsgRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: msg.rpc

ConversationRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: conversation.rpc

ThirdRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: third.rpc

# 管理员ID
AdminUserIDs:
  - "admin"

Log:
  ServiceName: cron
  Mode: console
  Level: info
  Format: json
  StackCooldownMillis: 100
