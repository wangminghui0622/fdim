Name: third.rpc
ListenOn: 10.0.4.12:8085
Mode: dev
# Etcd 配置（开发模式下可以注释掉，如果不需要服务发现）
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: third.rpc

Mongo:
  Host: mongodb://127.0.0.1:27017
  Database: openim_v3
  Username: "root"
  Password: "test625"

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: "test625"

ObjectStorage:
  Type: minio  # s3, minio, oss
  Endpoint: http://minio:9000
  Bucket: openim
  AccessKeyID: minioadmin
  SecretAccessKey: minioadmin
  # 说明：
  # 1. 确保 MinIO 服务已启动并可访问
  # 2. Bucket 会自动创建（如果不存在）
  # 3. 生产环境请修改 AccessKeyID 和 SecretAccessKey
  # 4. 如需使用 HTTPS，请将 Endpoint 改为 https://...

Log:
  ServiceName: third.rpc
  Mode: console
  Level: info
  Format: json
  StackCooldownMillis: 100
