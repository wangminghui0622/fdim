Name: msggateway.rpc
ListenOn: 10.0.4.12:8088
Mode: dev
# Etcd 配置（开发模式下可以注释掉，如果不需要服务发现）
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: msggateway.rpc

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: "test625"

# LongConnServer WebSocket 长连接服务器配置
LongConnServer:
  Ports:
    - 10001
  WebsocketMaxConnNum: 100000
  WebsocketTimeout: 60
  WebsocketMaxMsgLen: 4096

# RPC 客户端配置
AuthRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: auth.rpc

Log:
  ServiceName: msggateway.rpc
  Mode: console
  Level: info
  Format: json
  StackCooldownMillis: 100
