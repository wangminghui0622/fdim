Name: msgtransfer
Mode: dev

# MongoDB 配置
MongoDB:
  URI: mongodb://root:test625@127.0.0.1:27017/openim_v3?authSource=admin
  Database: openim_v3
  Username: ""
  Password: ""

# Redis 配置
Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: "test625"

# NATS 配置
Nats:
  Brokers:
    - 127.0.0.1:4222
  ToRedisTopic: toRedis
  ToMongoTopic: toMongo
  ToPushTopic: toPush
  ToOfflinePushTopic: toOfflinePush
  ToRedisGroupID: redis
  ToMongoGroupID: mongo
  ToPushGroupID: push
  ToOfflinePushGroupID: offlinePush

# Conversation RPC 配置（用于创建会话）
ConversationRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: conversation.rpc

# 批处理配置
Batch:
  Size: 500
  Interval: 100  # 毫秒
  Workers: 50

Log:
  ServiceName: msgtransfer
  Mode: console
  Level: info
  Format: json
  StackCooldownMillis: 100
